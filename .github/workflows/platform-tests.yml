name: Platform Tests

# The full suite on every platform, once a change has landed.
#
# ci.yml runs the integration suites in tests/*.rs on ubuntu only, because each
# of their 75 tests spawns `grans.exe` and that costs ~2s per spawn on the
# Windows runner against 0.037s on ubuntu -- 225s of a 5m14s leg for tests that
# contain no platform-gated code. Running them here keeps the coverage without
# charging it to every push: a Windows or macOS regression in path handling or
# terminal output surfaces against the commit that caused it, which is early
# enough to matter and was the gap #93 was filed about.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/platform-tests.yml'
  # A change to this workflow is exercised on the PR that makes it, rather than
  # first running after the merge it could break.
  pull_request:
    paths:
      - '.github/workflows/platform-tests.yml'
  # The toolchain floats on `stable`, so a rustc release can break the build
  # with no push to trigger the job.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  full-suite:
    name: Full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Nothing blocks on this workflow, so a hung leg here would burn the 360
    # minute default unnoticed. See the same guard in ci.yml.
    timeout-minutes: 20
    strategy:
      # Each leg reports on its own platform, so one failure must not cancel
      # the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Must match ci.yml: rust-cache keys on these, and the two workflows share
      # a cache so a PR does not start cold.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: grans-tests

      - name: Run tests
        run: cargo test --no-fail-fast

  # These runs sit off the critical path: nothing blocks on them and no PR shows
  # their result, so the only signal a failure otherwise gives is an email to
  # whoever happened to trigger the run. That is indistinguishable from silence,
  # and for the weekly cron it is worse, since GitHub attributes those runs to
  # the repository rather than to an author. So file the failure where the work
  # is actually tracked.
  #
  # Skipped on pull_request: a change to this workflow already shows its own red
  # X on the PR that made it, and filing an issue for that would be noise.
  report-failure:
    name: Report failure
    needs: full-suite
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          body="The full suite failed on \`${GITHUB_REF_NAME}\` at \`${SHA:0:8}\` (\`${TRIGGER}\`).

          ${RUN_URL}

          ci.yml runs the integration suites on ubuntu only, so a failure here
          that the PR did not catch is most likely macOS- or Windows-specific."

          # One open issue per outage, not one per run: a cron that fails every
          # Monday should grow a comment thread rather than a pile of duplicates.
          existing=$(gh issue list --repo "$REPO" --state open \
            --label 'ci: platform-tests' --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "Commented on existing issue #${existing}"
          else
            gh issue create --repo "$REPO" \
              --title "Platform tests are failing on ${GITHUB_REF_NAME}" \
              --label 'ci: platform-tests' --label 'type: bug' --label 'status: triage' \
              --body "$body"
          fi
