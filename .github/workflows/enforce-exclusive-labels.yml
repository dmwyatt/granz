name: Enforce Exclusive Labels

on:
  issues:
    types: [labeled]

jobs:
  enforce-exclusive:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Remove conflicting labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ADDED_LABEL: ${{ github.event.label.name }}
          # The issue's labels as of this event, the added one included. Read
          # live instead, two labels added in quick succession would each
          # remove the other.
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          REPO: ${{ github.repository }}
        run: |
          # An issue carries one label from each of these groups, and the added
          # label replaces the one before it. A group is every label with the
          # prefix, so a label created later needs no entry here.
          replaced=$(jq -rn --arg added "$ADDED_LABEL" --argjson labels "$ISSUE_LABELS" '
            ($added | split(": ")[0]) as $group
            | if $group | IN("type", "status", "prio", "size")
              then $labels | map(select(. != $added and startswith($group + ": ")))
              else []
              end
            | join(",")
          ')

          if [[ -n "$replaced" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$replaced"
          fi
