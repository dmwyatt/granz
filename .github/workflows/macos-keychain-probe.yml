name: macOS keychain probe

# Manual only, and deliberately not part of CI.
#
# Rewriting a keychain item's ACL needs ChangeACL on an item pinned to a binary
# whose code signature a CI runner cannot match. Security escalates that to
# SecurityAgent, which has no window server to draw on and never returns, so the
# call blocks instead of failing. `cargo test` has no per-test timeout, so a
# single one of these holds its whole test binary open until the job is killed.
#
# The tests are therefore #[ignore]d out of the normal suite, and run here one
# at a time under individual timeouts, so a block is a data point rather than an
# hour of billed macOS runner time.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  probe:
    name: Probe
    runs-on: macos-latest
    # Backstop. Every step below is individually bounded; this catches anything
    # that escapes those bounds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: grans-tests

      # Control: can anything write a permissive ACL on this runner? `-A` is
      # exactly the ACL the Rust code composes by hand, and this creates the
      # item with it rather than rewriting one afterwards. If this succeeds
      # while the Rust probes block, the problem is rewriting an existing
      # item's ACL, not permissive ACLs as such.
      - name: Control -- Apple's own tool, creating with a permissive ACL
        run: |
          set -x
          KC="$RUNNER_TEMP/probe-control.keychain"
          security create-keychain -p probe "$KC"
          security unlock-keychain -p probe "$KC"
          security add-generic-password -A -s grans-probe -a control -w s3cret "$KC"
          echo "--- created; now read it back ---"
          security find-generic-password -s grans-probe -a control -w "$KC"
          echo "--- and its access control ---"
          security dump-keychain -a "$KC" | head -40
        timeout-minutes: 3

      # Second control: rewriting an EXISTING item's ACL, via the same tool.
      # `security` has no verb for this, so the closest equivalent is asking for
      # the partition list, which also needs ChangeACL. A block here says the
      # authorization is unreachable for any caller, not just ours.
      - name: Control -- ChangeACL on an existing item
        run: |
          set -x
          KC="$RUNNER_TEMP/probe-control.keychain"
          security set-generic-password-partition-list \
            -S apple-tool:,apple: -s grans-probe -a control -k probe "$KC" \
            && echo "RESULT: ChangeACL succeeded" \
            || echo "RESULT: ChangeACL failed with $?"
        timeout-minutes: 3

      - name: Build the test binary
        run: cargo test --bins --no-run

      # Each probe gets its own bounded run. macOS has no GNU `timeout`, so
      # perl's alarm stands in for it: it SIGALRMs the process it exec'd into.
      - name: Probe each keychain write separately
        run: |
          status=0
          for t in probe_building_permissive_access_does_not_block \
                   test_permissive_access_trusts_every_application \
                   test_permissive_access_leaves_the_secret_readable; do
            echo "::group::$t"
            if perl -e 'alarm(shift); exec @ARGV' 90 \
                 cargo test --bins "$t" -- --ignored --nocapture --test-threads=1; then
              echo "RESULT $t: completed"
            else
              rc=$?
              echo "RESULT $t: did not complete (exit $rc; 142 = timed out on SIGALRM)"
              status=1
            fi
            echo "::endgroup::"
          done
          # The probe reports; it does not gate. A block is the finding.
          echo "probe finished with aggregate status $status"
        timeout-minutes: 8

      # The read path is expected to work headless. If this ever stops passing,
      # the module's premise changed and the probes above are reading noise.
      - name: Sanity -- the read-only keychain tests still pass
        run: cargo test --bins keychain_acl -- --nocapture
        timeout-minutes: 5
