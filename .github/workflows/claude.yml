name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write  # Allows Claude to update issue labels when working on issues
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # The action refuses a trigger from someone without write access, but
      # not our own trigger on an issue or PR someone else opened. Their text
      # would then reach a session that can edit files and run `cargo build`
      # and `cargo test`, and on a fork PR the checkout is their code.
      - name: Refuse issues and pull requests opened outside the repo
        env:
          AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.issue.author_association || github.event.pull_request.author_association }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) exit 0 ;;
          esac
          # Issues filed by this repo's own workflows, such as a failed
          # weekly cargo update.
          if [[ "$AUTHOR" == "github-actions[bot]" ]]; then
            exit 0
          fi
          echo "::error::Not running: this was opened by $AUTHOR ($ASSOCIATION), and Claude would act on their text with write access to the repository."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: "true"

          # Comments by anyone else on the thread are left out of what Claude
          # reads. The action takes comment authors from GraphQL, which names
          # bots without the `[bot]` suffix, so a `*[bot]` pattern matches
          # nothing. The two bots that comment here are listed by those names.
          # `claude` also matches a human account of that name.
          include_comments_by_actor: "${{ github.repository_owner }},claude,github-actions"

          additional_permissions: |
            actions: read

          system_prompt: |
            When working on GitHub issues:
            - When you start implementing a feature or fix, update the issue to `status: in progress`
            - When you open a PR for an issue, update the issue to `status: code review`
            - When setting a new status label, remove only the other `status: *` labels (not type/prio/size labels)

            Example: gh issue edit <number> --remove-label "status: ready" --remove-label "status: triage" --remove-label "status: in progress" --remove-label "status: code review" --add-label "status: <new>"

          # The gh commands read CI results, PRs and issues, and edit issue
          # labels. A `gh api` rule would allow any request the token can
          # make, writes included, since a prefix cannot restrict the method.
          claude_args: '--allowedTools "Bash(cargo test:*)" "Bash(cargo build:*)" "Bash(cargo check:*)" "Bash(cargo fmt:*)" "Bash(cargo clippy:*)" "Bash(gh pr view:*)" "Bash(gh pr checks:*)" "Bash(gh run view:*)" "Bash(gh run list:*)" "Bash(gh issue view:*)" "Bash(gh issue edit:*)"'

